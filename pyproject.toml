[project]
name = "save-issues"
version = "0.1.0"
description = "CLI tool to download GitHub issues as zip archives (json/md/html)"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Starry-Sky-World", email = "liu_qinyu@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "rich>=15.0.0",
]

[project.scripts]
save-issues = "save_issues.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
